blueprint:
  name: Valve Temperature Offset Calibration
  description: |
    Calibrate a radiator thermostat against a room sensor. Select a dedicated
    heat demand helper to also regulate by room temperature. The thermostat's
    current setpoint is the room target, including changes made on the valve.
    This blueprint only writes the temperature offset and the optional helper.

    Room regulation starts at or below the setpoint minus the configured
    start difference and stops at the setpoint. Between those thresholds it
    keeps the previous demand.
    Use a dedicated Input Boolean without an initial state per room.
    The regulation correction moves the valve reading past its switching
    margin where possible. Once heating stops, only calibration remains.
    Room regulation requires Celsius.

    Optionally publish the calculation for the Valve Temperature Offset
    Diagnostics template blueprint. The regulator does not read its sensors.
    An Input Datetime with both date and time stores the last write attempt
    separately from periodic diagnostic updates and survives restarts.

    Without a helper, the blueprint only calibrates against the room sensor.
  domain: automation
  source_url: https://raw.githubusercontent.com/trandus/hass-blueprints/main/blueprints/automation/valve_temperature_calibration/valve_temperature_offset_calibration.yaml

  input:
    climate_entity:
      name: Thermostatic valve (climate)
      description: |
        Select the `climate` entity of your smart radiator valve (TRV).
        This is the entity that controls the heating in Home Assistant, for example:
        `climate.hama_valve_gerald_thermostat`.
      selector:
        entity:
          domain:
            - climate
          reorder: false
          multiple: false

    offset_number_entity:
      name: Temperature offset entity (number)
      description: |
        Select the `number` entity that controls the valve's temperature offset.
        It usually ends with `_local_temperature_offset` and is linked to the valve
        device. Example: `number.hama_valve_gerald_local_temperature_offset_2`.
      selector:
        entity:
          domain:
            - number
          reorder: false
          multiple: false

    external_sensor:
      name: External temperature sensor
      description: |
        Select the temperature sensor that measures the actual room temperature.
        This should be a `sensor` entity that provides the correct ambient temperature,
        for example: `sensor.lumi_gerald_temperature`.
      selector:
        entity:
          domain:
            - sensor
          device_class:
            - temperature
          reorder: false
          multiple: false

    reported_temperature_includes_offset:
      name: Reported temperature includes calibration
      description: |
        Enable this when the valve applies its existing calibration before
        reporting current_temperature. Leave it off when the valve reports
        its raw sensor reading.
      default: false
      selector:
        boolean:

    min_interval:
      name: Minimum time between adjustments in the same phase
      description: |
        Minimum seconds between offset attempts, including retries. When room
        demand changes, the regulator can act after a 30-second settling period.
        Pending updates are recalculated every 30 seconds.
      default: 300
      selector:
        number:
          min: 30.0
          max: 3600.0
          step: 1.0
          mode: box
          unit_of_measurement: s

    rounding_step:
      name: Rounding step for offset value
      description: |
        Define the rounding step for calibration-only use. Room regulation
        rounds to the offset entity's own step.
        Use `0.5` for half-degree rounding, or `1.0` for full degrees. Results must
        also match the offset entity's step. Min/max clamping happens after rounding.
      default: 1.0
      selector:
        number:
          min: 0.1
          max: 2.0
          step: 0.1
          mode: box
          unit_of_measurement: °C

    manual_correction:
      name: Manual correction (bias)
      description: |
        Additional manual bias applied to the computed offset **before rounding**.
        Use this if the valve still behaves undesirably after calibration:
        - **Positive value** (e.g., +0.1..+1.0 °C): Makes the valve think it's **warmer** → **reduces** heating sooner.
        - **Negative value** (e.g., -0.1..-1.0 °C): Makes the valve think it's **cooler** → **prolongs** heating.
        Room regulation applies this bias to the baseline calibration. The demand
        thresholds and the required valve margin stay unchanged.
      default: 0.0
      selector:
        number:
          min: -1.0
          max: 1.0
          step: 0.1
          mode: slider
          unit_of_measurement: °C


    heat_demand_helper:
      name: Room heat demand helper (optional)
      description: |
        Select a dedicated Input Boolean to enable room regulation. It saves
        demand across reloads and restarts. Leave empty for calibration only.
      default: ""
      selector:
        entity:
          domain: input_boolean

    room_hysteresis:
      name: Heating start difference below setpoint
      description: Start at or below the setpoint minus this difference. Stop at or above the setpoint.
      default: 0.5
      selector:
        number:
          min: 0.1
          max: 2
          step: 0.1
          unit_of_measurement: °C

    valve_margin:
      name: Valve temperature margin
      description: |
        Minimum temperature difference to request heating or idle from the valve.
        Set this above the valve's own switching tolerance. For Hama Saswell, start
        at 2 °C. The offset's min/max limits still apply.
      default: 2.0
      selector:
        number:
          min: 0.5
          max: 5
          step: 0.1
          unit_of_measurement: °C

    offset_attempt_helper:
      name: Offset write timestamp helper (optional)
      description: |
        Select a dedicated Input Datetime with date and time and no initial
        value. This allows periodic diagnostics without changing write timing.
        Without it, the automation uses the time of its last action run.
      default: ""
      selector:
        entity:
          domain: input_datetime

    publish_offset_diagnostics:
      name: Publish offset diagnostics
      description: |
        Emit the offset calculation for the companion template blueprint.
        With a timestamp helper, publish a settled sample on the periodic check
        even when the valve needs no new write.
      default: false
      selector:
        boolean:

mode: single
max_exceeded: silent

variables:
  climate_entity: !input climate_entity
  external_sensor: !input external_sensor
  offset_entity: !input offset_number_entity
  heat_demand_helper: !input heat_demand_helper
  offset_attempt_helper: !input offset_attempt_helper
  publish_offset_diagnostics: !input publish_offset_diagnostics
  room_hysteresis: !input room_hysteresis
  valve_margin: !input valve_margin
  min_interval: !input min_interval
  rounding_step: !input rounding_step
  manual_correction: !input manual_correction
  reported_temperature_includes_offset: !input reported_temperature_includes_offset

  # Read the available inputs once for both the decision and its actions.
  current_offset: "{{ states(offset_entity) | float(none) }}"
  reported_temperature: "{{ state_attr(climate_entity, 'current_temperature') | float(none) }}"
  room_temperature: "{{ states(external_sensor) | float(none) }}"
  target_temperature: "{{ state_attr(climate_entity, 'temperature') | float(none) }}"
  climate_mode: "{{ states(climate_entity) }}"
  hvac_action: "{{ state_attr(climate_entity, 'hvac_action') }}"
  offset_min: "{{ state_attr(offset_entity, 'min') | float(none) }}"
  offset_max: "{{ state_attr(offset_entity, 'max') | float(none) }}"
  offset_step: "{{ state_attr(offset_entity, 'step') | float(none) }}"

  # A write and its corrected temperature report can arrive separately.
  offset_age: >-
    {{ as_timestamp(now()) - as_timestamp(states[offset_entity].last_changed)
       if is_number(current_offset) else none }}
  offset_report_settled: >-
    {{ not reported_temperature_includes_offset
       or (is_number(offset_age) and offset_age >= 30 and has_value(climate_entity)
           and (states[climate_entity].last_reported | default(states[climate_entity].last_updated))
               >= states[offset_entity].last_changed) }}
  offset_report_timed_out: >-
    {{ is_number(offset_age) and offset_age >= 120 and not offset_report_settled }}
  raw_temperature: >-
    {% if has_value(climate_entity) and is_number(reported_temperature)
          and not (heat_demand_helper != '' and offset_report_timed_out) and
          (not reported_temperature_includes_offset or is_number(current_offset)) %}
      {{ reported_temperature - (current_offset if reported_temperature_includes_offset else 0) }}
    {% else %}
      {{ none }}
    {% endif %}

  # The helper preserves room demand between the start threshold and the setpoint.
  regulating: "{{ heat_demand_helper != '' }}"
  demand_state: "{{ states(heat_demand_helper) if regulating else 'off' }}"
  was_demanding: "{{ demand_state == 'on' }}"
  heat_threshold: >-
    {{ (target_temperature - room_hysteresis) | round(6)
       if regulating and is_number(target_temperature) else none }}
  celsius_readings: >-
    {{ state_attr(climate_entity, 'temperature_unit') == '°C'
       and state_attr(external_sensor, 'unit_of_measurement') == '°C'
       and state_attr(offset_entity, 'unit_of_measurement') == '°C' }}
  room_control_ready: >-
    {{ regulating and demand_state in ['on', 'off'] and climate_mode == 'heat'
       and is_number(heat_threshold) and is_number(room_temperature)
       and celsius_readings }}
  regulator_ready: "{{ room_control_ready and is_number(raw_temperature) }}"
  desired_demand: >-
    {% if climate_mode == 'off' %}
      {{ false }}
    {% elif room_control_ready %}
      {{ room_temperature < target_temperature and
         (was_demanding or room_temperature <= heat_threshold) }}
    {% else %}
      {{ was_demanding }}
    {% endif %}
  phase_changed: "{{ desired_demand != was_demanding }}"

  grid_ready: >-
    {{ is_number(offset_min) and is_number(offset_max) and is_number(offset_step)
       and offset_step > 0 and offset_max >= offset_min }}
  last_offset_index: >-
    {{ ((((offset_max - offset_min) / offset_step) + 0.000001) | round(0, 'floor'))
       if grid_ready else none }}
  calibrated_room_temperature: >-
    {{ room_temperature + manual_correction if is_number(room_temperature) else none }}

  # Baseline calibration is the closest supported offset to align the readings.
  calibration_offset: >-
    {% if grid_ready and (not regulating or celsius_readings)
          and is_number(raw_temperature) and is_number(calibrated_room_temperature) %}
      {% set steps = (calibrated_room_temperature - raw_temperature - offset_min) / offset_step %}
      {% set index = [0, [steps | round(0), last_offset_index] | min] | max %}
      {{ (offset_min + index * offset_step) | round(6) }}
    {% else %}
      {{ none }}
    {% endif %}

  # Add a regulation correction only to request a valve transition or hold heating.
  phase_offset: >-
    {% if not (is_number(current_offset) and grid_ready) %}
      {{ none }}
    {% elif regulating and regulator_ready and not desired_demand and hvac_action != 'heating' %}
      {{ calibration_offset }}
    {% elif regulating %}
      {% if regulator_ready %}
        {% set valve_limit = target_temperature + (-valve_margin if desired_demand else valve_margin) %}
        {% set limit_index = (valve_limit - raw_temperature - offset_min) / offset_step %}
        {% set calibration_index = (calibration_offset - offset_min) / offset_step %}
        {% if desired_demand %}
          {% set index = [calibration_index, (limit_index + 0.000001) | round(0, 'floor')] | min %}
        {% else %}
          {# Hold a stronger closing correction while the valve reports heating. #}
          {% set applied_index = ((current_offset - offset_min) / offset_step) | round(0) %}
          {% set index = [calibration_index, applied_index, (limit_index - 0.000001) | round(0, 'ceil')] | max %}
        {% endif %}
      {% else %}
        {% set index = ((0 - offset_min) / offset_step) | round(0) %}
      {% endif %}
      {{ (offset_min + [0, [index, last_offset_index] | min] | max * offset_step) | round(6) }}
    {% elif has_value(climate_entity) and is_number(raw_temperature)
            and is_number(room_temperature) and rounding_step > 0 %}
      {% set value = ((room_temperature - raw_temperature + manual_correction) / rounding_step)
                     | round(0) * rounding_step %}
      {% set bounded = [offset_min, [value, offset_max] | min] | max %}
      {% set steps = (bounded - offset_min) / offset_step %}
      {{ bounded if (steps - (steps | round(0))) | abs < 0.000001 else none }}
    {% else %}
      {{ none }}
    {% endif %}
  regulation_offset: >-
    {{ (phase_offset - calibration_offset) | round(6)
       if is_number(phase_offset) and is_number(calibration_offset) else none }}
  calculated_offset: >-
    {{ (calibration_offset + regulation_offset) | round(6)
       if is_number(regulation_offset) else phase_offset }}

  # Track write attempts independently of diagnostic-only runs.
  timestamp_helper_ready: >-
    {{ offset_attempt_helper != '' and has_value(offset_attempt_helper)
       and state_attr(offset_attempt_helper, 'has_date')
       and state_attr(offset_attempt_helper, 'has_time')
       and is_number(state_attr(offset_attempt_helper, 'timestamp')) }}
  last_offset_attempt: >-
    {{ state_attr(offset_attempt_helper, 'timestamp') | float
       if timestamp_helper_ready
       else as_timestamp(this.attributes.get('last_triggered'), 0) }}
  attempt_age: >-
    {{ as_timestamp(now()) - last_offset_attempt }}
  offset_settled: >-
    {{ not (regulating and reported_temperature_includes_offset and is_number(current_offset))
       or (offset_age >= 30 and (not regulator_ready or offset_report_settled)) }}
  update_demand: "{{ phase_changed and offset_settled and attempt_age >= 30 }}"
  update_offset: >-
    {{ is_number(calculated_offset) and (calculated_offset - current_offset) | abs > 0.000001
       and offset_settled and attempt_age >= (30 if phase_changed else min_interval) }}

  # Hold the previous diagnostic sample when the two Zigbee reports are in flight.
  # The periodic trigger also covers identical temperature reports.
  sample_ready: >-
    {{ publish_offset_diagnostics and (not is_number(raw_temperature) or
       (offset_report_settled and as_timestamp(now())
        - as_timestamp(states[climate_entity].last_updated) >= 2)) }}
  publish_diagnostics: >-
    {{ sample_ready and (timestamp_helper_ready or update_offset or update_demand) }}
  attempt_timestamp: "{{ as_timestamp(now()) | int if update_offset else last_offset_attempt }}"
  sample: >-
    {% if publish_diagnostics %}
      {{ dict(calibration_offset=calibration_offset,
              regulation_offset=regulation_offset,
              total_offset=calculated_offset,
              applied_total_offset=current_offset,
              raw_temperature=raw_temperature,
              calibrated_temperature=(raw_temperature + calibration_offset) | round(1)
                                     if is_number(calibration_offset) else none,
              target_temperature=target_temperature,
              heat_threshold=heat_threshold,
              heat_demand=desired_demand,
              hvac_action=hvac_action) }}
    {% else %}
      {{ none }}
    {% endif %}

trigger:
  - platform: state
    entity_id: !input external_sensor
    to: null
  - platform: state
    entity_id: !input climate_entity
  - platform: homeassistant
    event: start
  - platform: time_pattern
    seconds: "/30"

condition:
  - condition: template
    value_template: "{{ update_demand or update_offset or publish_diagnostics }}"

action:
  - if:
      - condition: template
        value_template: "{{ update_demand }}"
    then:
      - service: "input_boolean.turn_{{ 'on' if desired_demand else 'off' }}"
        target:
          entity_id: "{{ heat_demand_helper }}"
  - if:
      - condition: template
        value_template: "{{ update_offset }}"
    then:
      # Keep the attempt time even when the valve rejects a write.
      - if:
          - condition: template
            value_template: "{{ timestamp_helper_ready }}"
        then:
          - service: input_datetime.set_datetime
            target:
              entity_id: "{{ offset_attempt_helper }}"
            data:
              timestamp: "{{ attempt_timestamp }}"
      - service: number.set_value
        target:
          entity_id: "{{ offset_entity }}"
        data:
          value: "{{ calculated_offset }}"
  - if:
      - condition: template
        value_template: "{{ publish_diagnostics }}"
    then:
      - event: trandus_valve_offset_diagnostics
        event_data:
          offset_entity: "{{ offset_entity }}"
          sample: "{{ sample }}"
          last_offset_attempt: "{{ attempt_timestamp }}"
