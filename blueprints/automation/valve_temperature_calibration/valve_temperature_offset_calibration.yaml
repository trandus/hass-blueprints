blueprint:
  name: Valve Temperature Offset Calibration
  description: |
    Automatically calibrate the temperature offset of a smart radiator valve (TRV)
    using the readings from an external room temperature sensor.
    Only use this blueprint with valves whose `current_temperature` reports the
    temperature before offset correction. The calculation is:
    room temperature - valve temperature + manual_correction.
    The current offset is used only to check whether a write is needed.
    The result is rounded to `rounding_step`, then clamped to the offset number
    entity's min/max limits without rounding again. For limits of -2.5 to +2.5 °C,
    rounded results of -3 and +3 °C become -2.5 and +2.5 °C.
    Calibration is skipped when readings or limits are unavailable/invalid, the
    entity step is invalid, or the result does not match that step.

    Temperature changes and a periodic check every 30 seconds recalculate using
    current readings. Each automation has its own `min_interval` between attempts
    to write a changed offset, including failed attempts. A pending correction is
    evaluated again on the first periodic check after the interval, also after
    automation reloads or entity recovery. The automation must be enabled and idle.
    Differences of at most 0.000001 °C are skipped before actions start and do not
    restart the interval. Manual edits to the offset are temporary: the next
    eligible recalculation can overwrite them. Use `manual_correction` for a bias.

    Example use case:
      - `climate_entity`: climate.hama_valve_gerald_thermostat
      - `external_sensor`: sensor.lumi_gerald_temperature
      - `offset_number_entity`: number.hama_valve_gerald_local_temperature_offset_2
      - `rounding_step`: 1.0

    The supported offset range and rounding can limit how closely the corrected
    valve temperature matches the external room sensor.

    Manual correction:
      Use the **manual_correction** slider to bias the calculated offset in cases where the valve
      tends to stop heating too early or overheats even after calibration.

      - Positive value (e.g., +0.3 °C): The valve will assume the room is warmer → it reduces heating sooner.
      - Negative value (e.g., -0.3 °C): The valve will assume the room is cooler → it prolongs heating.

  domain: automation
  source_url: https://raw.githubusercontent.com/trandus/hass-blueprints/main/blueprints/automation/valve_temperature_calibration/valve_temperature_offset_calibration.yaml

  input:
    climate_entity:
      name: Thermostatic valve (climate)
      description: |
        Select the `climate` entity of your smart radiator valve (TRV).
        This is the entity that controls the heating in Home Assistant, for example:
        `climate.hama_valve_gerald_thermostat`.
      selector:
        entity:
          domain:
            - climate
          reorder: false
          multiple: false

    offset_number_entity:
      name: Temperature offset entity (number)
      description: |
        Select the `number` entity that controls the valve's temperature offset.
        It usually ends with `_local_temperature_offset` and is linked to the valve
        device. Example: `number.hama_valve_gerald_local_temperature_offset_2`.
      selector:
        entity:
          domain:
            - number
          reorder: false
          multiple: false

    external_sensor:
      name: External temperature sensor
      description: |
        Select the temperature sensor that measures the actual room temperature.
        This should be a `sensor` entity that provides the correct ambient temperature,
        for example: `sensor.lumi_gerald_temperature`.
      selector:
        entity:
          domain:
            - sensor
          device_class:
            - temperature
          reorder: false
          multiple: false

    min_interval:
      name: Minimum time between updates
      description: |
        Minimum time (in seconds) between attempts to write a changed offset for
        this automation, including failed writes. At least this much time must pass.
        Unchanged values and invalid readings do not restart the interval.
        Skipped corrections are checked again every 30 seconds using current readings.
        A typical value is 300 seconds (5 minutes).
      default: 300
      selector:
        number:
          min: 30.0
          max: 3600.0
          step: 1.0
          mode: box
          unit_of_measurement: s

    rounding_step:
      name: Rounding step for offset value
      description: |
        Define the step to which the calculated offset should be rounded.
        Use `0.5` for half-degree rounding, or `1.0` for full degrees. Results must
        also match the offset entity's step. Min/max clamping happens after rounding.
      default: 1.0
      selector:
        number:
          min: 0.1
          max: 2.0
          step: 0.1
          mode: box
          unit_of_measurement: °C

    manual_correction:
      name: Manual correction (bias)
      description: |
        Additional manual bias applied to the computed offset **before rounding**.
        Use this if the valve still behaves undesirably after calibration:
        - **Positive value** (e.g., +0.1..+1.0 °C): Makes the valve think it's **warmer** → **reduces** heating sooner.
        - **Negative value** (e.g., -0.1..-1.0 °C): Makes the valve think it's **cooler** → **prolongs** heating.
        Recommended start: 0.0 °C. Adjust in small steps (±0.1 °C), observe behavior for a few cycles.
      default: 0.0
      selector:
        number:
          min: -1.0
          max: 1.0
          step: 0.1
          mode: slider
          unit_of_measurement: °C

mode: single
max_exceeded: silent

variables:
  climate_entity: !input climate_entity
  external_sensor: !input external_sensor
  min_interval: !input min_interval
  offset_entity: !input offset_number_entity
  rounding_step: !input rounding_step
  manual_correction: !input manual_correction

  current_offset: |
    {{ states(offset_entity) | float(none) }}

  current_temperature: |
    {{ state_attr(climate_entity, 'current_temperature') | float(none) }}

  external_temperature: |
    {{ states(external_sensor) | float(none) }}

  calculated_offset: |
    {% set step = rounding_step | float(none) %}
    {% set minimum = state_attr(offset_entity, 'min') | float(none) %}
    {% set maximum = state_attr(offset_entity, 'max') | float(none) %}
    {% if is_number(current_temperature) and is_number(external_temperature)
          and is_number(manual_correction) and is_number(step) and step > 0
          and is_number(minimum) and is_number(maximum) and minimum <= maximum %}
      {% set raw = external_temperature - current_temperature + (manual_correction | float) %}
      {% set rounded = ((raw / step) | round(0)) * step %}
      {{ [minimum, [rounded, maximum] | min] | max }}
    {% else %}
      {{ none }}
    {% endif %}

trigger:
  - platform: state
    entity_id: !input external_sensor
  - platform: state
    entity_id: !input climate_entity
    attribute: current_temperature
  - platform: time_pattern
    seconds: "/30"

condition:
  - condition: template
    value_template: "{{ offset_entity != '' }}"
  - condition: template
    value_template: |
      {{ is_number(states(offset_entity))
         and has_value(climate_entity)
         and is_number(state_attr(climate_entity, 'current_temperature'))
         and is_number(states(external_sensor)) }}
  - condition: template
    value_template: |
      {{ is_number(state_attr(offset_entity, 'min'))
         and is_number(state_attr(offset_entity, 'max'))
         and is_number(state_attr(offset_entity, 'step'))
         and (state_attr(offset_entity, 'min') | float) <= (state_attr(offset_entity, 'max') | float)
         and (state_attr(offset_entity, 'step') | float(0)) > 0 }}
  - condition: template
    value_template: |
      {% set value = calculated_offset | float(0) %}
      {% set minimum = state_attr(offset_entity, 'min') | float(0) %}
      {% set maximum = state_attr(offset_entity, 'max') | float(0) %}
      {% set target_step = state_attr(offset_entity, 'step') | float(0) %}
      {% set steps_from_minimum = (value - minimum) / target_step if target_step > 0 else -1 %}
      {{ is_number(calculated_offset)
         and target_step > 0
         and minimum <= value <= maximum
         and ((steps_from_minimum - (steps_from_minimum | round(0))) | abs) < 0.000001 }}
  - condition: template
    value_template: |
      {{ is_number(calculated_offset) and is_number(current_offset)
         and ((calculated_offset | float) - (current_offset | float)) | abs > 0.000001 }}
  - condition: template
    value_template: |
      {% set last = state_attr(this.entity_id, 'last_triggered') %}
      {{ last is none or (as_timestamp(now()) - as_timestamp(last, 0)) >= min_interval }}

action:
  - service: number.set_value
    target:
      entity_id: "{{ offset_entity }}"
    data:
      value: "{{ calculated_offset }}"
